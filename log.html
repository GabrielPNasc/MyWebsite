<header class="top">
  <a class="top__brand" href="index.html">gabriel$</a>

        <li><button type="button" class="lang-menu__btn" data-lang="pt" lang="pt">Português</button></li>
        <li><button type="button" class="lang-menu__btn" data-lang="en" lang="en">English</button></li>

      <h1 class="log-page__title" id="log-heading" data-i18n="log.title">Log</h1>
      <span class="log-page__year">2026</span>
    </div>
    <p class="log-page__intro" data-i18n="log.intro">// what I did, month by month.</p>

    <ol class="log">
      <li class="log__row">
        <div class="log__when">
          <span class="log__date">2026-11</span>
          <span class="log__now" data-i18n="log.now">now</span>
        </div>
        <ul class="log__items">
          <li data-i18n="log.2026.11.1">Started this log.</li>
          <li data-i18n="log.2026.11.2">Started the Expense Tracker project, to get more confident with Java.</li>
          <li data-i18n="log.2026.11.3">New look for the portfolio: dark layout, five languages and a terminal page.</li>
        </ul>
      </li>
    </ol>

    <!--
      Cada mês novo entra no topo, como um <li class="log__row"> igual ao de cima:

      <li class="log__row">
        <div class="log__when"><span class="log__date">2026-12</span></div>
        <ul class="log__items">
          <li data-i18n="log.2026.12.1">O que você fez naquele mês.</li>
        </ul>
      </li>

      A tradução de cada item vai em js/site-text.js, com a mesma chave do data-i18n.
    -->

  <footer class="foot">
    <a class="foot__top" href="#top" aria-label="Back to top">↑</a>
