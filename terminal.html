<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal — Gabriel Nascimento</title>
  <meta name="description" content="Interactive terminal with everything about Gabriel Nascimento: about, stack, projects, certificates and contact.">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 style-src 'self' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data: blob:;
                 script-src 'self' 'sha256-z3QlQdoDEeRSGTJIrwPiUIMOR/Jpi9Tiqmnpg4BqD5o=';
                 object-src 'none';
                 base-uri 'self';
                 frame-ancestors 'none';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=27">
  <link rel="icon" type="image/png" href="assets/images-removebg-preview.png">

  <!-- Aplica o tema salvo antes do primeiro paint, evitando flash de tema errado -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.dataset.theme = saved;
    })();
  </script>
</head>
<body id="top">

<header class="top">
  <a class="top__brand" href="index.html">gabriel$</a>
  <a class="top__link" href="terminal.html" aria-current="page">/terminal</a>
  <a class="top__link" href="log.html">/log</a>
  <div class="top__actions">
    <div class="lang-picker" id="lang-picker">
      <button type="button" class="lang-toggle" id="lang-toggle" aria-expanded="false" aria-haspopup="true" aria-controls="lang-menu" aria-label="Choose language" title="Choose language" data-i18n-aria-label="action.language" data-i18n-title="action.language">
        <svg class="lang-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>
        <span class="lang-toggle__code">EN</span>
        <svg class="lang-toggle__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <ul class="lang-menu" id="lang-menu" aria-label="Language" data-i18n-aria-label="action.language" hidden>
        <li><button type="button" class="lang-menu__btn" data-lang="pt" lang="pt">Português</button></li>
        <li><button type="button" class="lang-menu__btn" data-lang="en" lang="en">English</button></li>
        <li><button type="button" class="lang-menu__btn" data-lang="es" lang="es">Español</button></li>
        <li><button type="button" class="lang-menu__btn" data-lang="fr" lang="fr">Français</button></li>
        <li><button type="button" class="lang-menu__btn" data-lang="ja" lang="ja">日本語</button></li>
      </ul>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" data-i18n-aria-label="action.theme" aria-pressed="false">
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.7 15.3A8.5 8.5 0 1 1 8.7 3.3a7 7 0 0 0 12 12z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="term-page" aria-labelledby="terminal-heading">
    <h1 class="sec__title" id="terminal-heading">terminal</h1>

    <div class="tty">
      <div class="tty__bar">
        <span class="tty__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>gabriel@recife: ~</span>
      </div>

      <div class="tty__screen" id="tty-screen">
        <div id="tty-out" role="log" aria-live="polite"></div>
        <div class="tty__row">
          <span class="tty__prompt" aria-hidden="true">$</span>
          <input class="tty__input" id="tty-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input" autofocus>
        </div>
      </div>

      <div class="tty__chips" id="tty-chips">
        <button type="button" class="tty__chip" data-cmd="help">help</button>
        <button type="button" class="tty__chip" data-cmd="about">about</button>
        <button type="button" class="tty__chip" data-cmd="stack">stack</button>
        <button type="button" class="tty__chip" data-cmd="projects">projects</button>
        <button type="button" class="tty__chip" data-cmd="certs">certs</button>
        <button type="button" class="tty__chip" data-cmd="contact">contact</button>
        <button type="button" class="tty__chip" data-cmd="neofetch">neofetch</button>
        <button type="button" class="tty__chip" data-cmd="clear">clear</button>
      </div>
    </div>
  </section>
</main>

<script src="js/main.js?v=14" defer></script>
<script src="js/terminal.js?v=14" defer></script>
</body>
</html>
